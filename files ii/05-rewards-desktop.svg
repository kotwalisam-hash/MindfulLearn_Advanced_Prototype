eight="700" fill="#8A8A9B" text-anchor="middle">2 OF 5 MODULES</text><rect x="296" y="676" width="1096" height="100" rx="12" fill="#EEF7F2" stroke="#C9C9D4"/><circle cx="334" cy="726" r="14" fill="#E4E4EA" stroke="none"/><text x="364" y="718" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2B3A" text-anchor="start">Rewards are encouragement, never obligation.</text><text x="364" y="740" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#8A8A9B" text-anchor="start">There are no countdowns, loot boxes, expiring points or penalties for taking time off.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>