</text><text x="296" y="166" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#2B2B3A" text-anchor="start">Celebrate what you learn.</text><text x="296" y="192" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A8A9B" text-anchor="start">Rewards recognise effort and curiosity. They never disappear when you take a break.</text><rect x="296" y="216" width="1096" height="150" rx="22" fill="#7667D9" stroke="none"/><rect x="334" y="240" width="180" height="24" rx="12" fill="#ffffff40" stroke="none"/><text x="424" y="256" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">YOUR LEARNING POINTS</text><text x="334" y="314" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" text-anchor="start">240 pts</text><text x="334" y="342" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffffcc" text-anchor="start">Earned through lessons, reflection and helpful learning choices.</text><circle cx="1300" cy="291" r="50" fill="#ffffff40" stroke="none"/><text x="1300" y="300" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="400" fill="#fff" text-anchor="middle">✧</text><text x="296" y="408" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A8A9B" text-anchor="start">YOUR COLLECTION</text><text x="296" y="432" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B2B3A" text-anchor="start">Meaningful milestones</text><rect x="296" y="452" width="265" height="200" rx="16" fill="#fff" stroke="#C9C9D4"/><circle cx="428" cy="512" r="30" fill="#E0DBFA" stroke="none"/><text x="428" y="576" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2B3A" text-anchor="middle">Curious mind</text><text x="428" y="596" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#8A8A9B" text-anchor="middle">Completed